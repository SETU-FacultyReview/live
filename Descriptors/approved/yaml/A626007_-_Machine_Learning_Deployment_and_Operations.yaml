reference: A626007
full_title: Machine Learning Deployment and Operations
short_title: ML Ops
credits: 5
level: Advanced
author: JRELLIS
history_comment: New module on the Data Science and AI stream.
faculty: Science and Computing
department: Computing and Mathematics
cluster: Data Science and AI
aim: 'This module introduces students to the practical deployment of artificial intelligence
  models and applications. Students learn how trained machine-learning, natural language
  processing, time-series, and generative AI models can be exposed as usable services
  and integrated into software systems. The focus is on fundamental deployment patterns,
  evaluation in operational contexts, and responsible use, rather than full-scale
  industrial MLOps platforms.

  '
