  stage: 4
  semester: 8
  status: E
prerequisites: []
corequisites: []
indicative_content:
- '*From training to deployment:* saving, loading, and serving trained models'
- Batch inference and simple real-time inference services
- Deploying predictive models, NLP pipelines, and generative AI workflows
- '*System integration:* APIs and interaction with data pipelines'
- Basic versioning of models and inputs
- '*Evaluation in deployment:* latency, throughput, and output quality'
- Introduction to monitoring and logging for deployed AI systems
- '*Responsible deployment:* basic ethical, legal, and safety considerations'
- Documenting deployed AI systems and their limitations
learning_outcomes:
- Deploy trained AI models or workflows as usable software services.
- Integrate deployed AI components into simple software systems using APIs.
- Evaluate deployed AI systems using basic operational and quality metrics.
- Identify ethical, legal, and safety considerations relevant to deploying AI applications.
- Document deployment decisions, limitations, and expected behaviour of AI systems.
learning_and_teaching_methods:
- Lectures introducing core deployment concepts and patterns.
- Hands-on practical labs focused on deploying AI models and applications.
- Guided exercises integrating deployed models with simple software systems.
- Case-based discussion of real-world AI deployment examples.
