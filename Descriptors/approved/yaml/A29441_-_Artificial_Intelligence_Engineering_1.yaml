indicative_content:
- Introduction to Machine Learning / AI Engineering  - its roots in Data Mining, dependence
  on mathematics, statistics, data architectures, ...
- Machine learning pipelines - building understanding in stages, choosing appropriate
  procedures, assessing capability, reporting plausible results.
- Model building and inference from models - how to apply machine learning to make
  reliable predictions from data.
- 'Machine learning in support of data science: from data to insights'
learning_outcomes:
- Categorise typical data investigations, recognising how machine learning can be
  applied.
- Appraise the concepts and fundamentals of Classification, Regression and Clustering
  and their solution techniques.
- Evaluate the use of typical machine learning methods and choose appropriate algorithms
  and settings.
- Solve new problems using the investigative procedures (especially machine learning)
  introduced in the module.
- Assemble, validate and interpret the results of conducting the data investigation.
learning_and_teaching_methods:
- The lectures will introduce the theory content to the student. The student will
  be encouraged to participate in class discussions and ask questions to support their
  learning process.
- The practical classes facilitate the student in implementing the theory learned
  in the lectures, and will use the python ecosystem (software tools and packages)
  for machine learning.
- Students will apply typical methods of Machine Learning / AI Engineering to data
  sets provided in the practical classes.
- Students will choose and apply appropriate data-intensive machine learning techniques
  to representative data sets used for continuous assessment.
- Students will interpret and present the findings produced in the practical classes
  and continuous assessment.
