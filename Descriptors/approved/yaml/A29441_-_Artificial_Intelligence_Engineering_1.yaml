aim: 'The purpose of this module is to introduce the student to the fundamental concepts
  and techniques of Machine Learning / Artificial Intelligence Engineering.  The student
  will become familiar with both supervised learning (such as regression  and classification)
  and unsupervised learning (such as clustering and dimensionality reduction). Machine
  Learning / AI Engineering begins with understanding and cleaning the data, continues
  with feature engineering and analytical learning procedures, and is supplemented
  with validation and interpretation of the results. Students will be introduced to
  the tools needed to investigate data and to interpret and report their findings.
  The primary focus will be on discriminative rather than generative AI applications
  of Machine Learning. Practicals will help students to apply their knowledge, and
  assessments will largely test how well they can apply machine learning in practice.

  '
