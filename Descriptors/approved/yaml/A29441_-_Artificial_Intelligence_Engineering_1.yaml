assessment_criteria:
- <40%:Unable to interpret and describe key concepts of machine learning / AI engineering.
- 40%-49%:Be able to interpret and describe key concepts of machine learning / AI
  engineering.
- 50%-59%:Ability to discuss key concepts and ability to discover and integrate related
  knowledge in other knowledge domains, using well-known procedures and standard settings.
- 60%-69%:Be able to solve problems using machine learning by experimenting with the
  appropriate skills and tools, particularly when simple/obvious choices do not work
  well.
- 70%-100%:All the above to an excellent level. Be able to analyse and design solutions
  to a high standard for a range of both complex and unforeseen problems through the
  use and modification of appropriate skills and tools.
