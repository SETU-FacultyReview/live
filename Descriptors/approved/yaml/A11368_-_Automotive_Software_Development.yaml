indicative_content:
- Vehicle electronic architectures.
- AUTOSAR Classic Architecture.
- Software Components - Ports, Runnables, Runtime Environment, Data Types, Data Mapping.
- AUTOSAR Basic Software (BSW) - Operating System, I/O, Communication, Mode Management,
  Diagnostics, Memory Services.
- AUTOSAR workflow and tools.
- Timing Analysis.
- Functional Safety.
learning_outcomes:
- Understand how software applications are structured and distributed in an automotive
  environment.
- Understand the basic feautues of the AUTOSAR Basic Software.
- Design automotive applications using the AUTOSAR software architecture.
- Integrate industry-standard workflow and tools to develop automotive software.
- Understand the role of functional safety in automotive applications.
learning_and_teaching_methods:
- Combination of lectures and lab-based practicals.
- The lectures will cover the theory and underlying technologies in automotive software
  development.
- The lab-based practicals, building on the theoretical knowledge from the lectures,
  provide the practical skills to design, simulate and test automotive software applications.
- Students will be encouraged to enhance their lab work and assessment submissions
  using self-directed research and learning into the broader automotive industry topics
  and current issues.
