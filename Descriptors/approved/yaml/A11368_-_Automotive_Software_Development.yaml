reference: A11368
full_title: Automotive Software Development
short_title: Automotive Software Dev.
credits: 5
level: Advanced
author: BJACKMAN
history_comment: 'Updated to reflect that the AUTOSAR Classic standard is the main
  focus of software development. '
faculty: Science and Computing
department: Computing and Mathematics
cluster: Automotive, Automation and IoT
aim: This module introduces the student to the process of production-scale automotive
  software development using the AUTOSAR standard. A detailed technical examination
  of the AUTOSAR vehicle software architecture is presented and students will learn
  how to apply this to the development of automotive applications. In practical laboratory
  work students gain experience of advanced automotive software development and simulation
  tools to implement AUTOSAR applications.
