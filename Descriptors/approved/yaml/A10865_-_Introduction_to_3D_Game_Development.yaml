indicative_content:
- Collision and physics systems
- Navigation
- Environment creation
- Gameplay scripting and event-driven programming
- Object instantiation
- Artificial intelligence
- Assets creation and management
- 3D animation
- User interface design
- Version control systems for interactive media projects
learning_outcomes:
- Develop an interactive 3D game prototype using a contemporary game development environment.
- Implement gameplay mechanics using an object-oriented scripting approach.
- Employ both bespoke assets (audio, textures, 3D objects), and built-in assets (audio,
  textures, 3D objects), to create indoors and outdoors environments.
- Code and use navigation (first- and third-person controllers), collision detection,
  and cameras (e.g., view ports, multiple cameras, layers, etc.).
- Apply physics systems, particle effects, and animation controllers to enhance realism
  and responsiveness.
- Design and implement non-player character (NPC) behaviours using foundational AI
  techniques such as state-based systems and navigation meshes.
learning_and_teaching_methods:
- Since this module is focused on developing practical programming skills, the four
  contact hours will be delivered in computer labs in the form of two 2-hour practicals.
- Due to the very practical nature of the skills to be acquired in this module, these
  practical sessions will be centred around the idea of learning by doing, whereby
  students develop proficiency in the specified skill set through guided activities,
  and whereby lecturers provide short formal presentations of relevant concepts and
  technologies, as well as practical tips, feedback, and best practices.
