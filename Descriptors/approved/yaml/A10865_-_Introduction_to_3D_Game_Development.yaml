author: PFELICIA
history_comment: 'Aim, Indicative Content, and Learning Outcomes revised to be engine-agnostic,
  reducing Unity/C# specificity and incorporating Unreal Engine concepts and C++.  Minor
  revisions to learning outcomes for improved clarity and expression. Supplementary
  material updated. '
faculty: Science and Computing
department: Computing and Mathematics
cluster: Game Development
aim: This module will provide the students with the necessary skill set to develop
  a 3D game using using a modern game engine. It focuses on a high-level approach
  and the use of 3D game engines to create video games that implement some of the
  basic features found in commercial video games.
