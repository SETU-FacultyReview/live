assessment_criteria:
- <40%:Unable to describe and apply basic ML model building and validation procedures.
- 40%-49%:Be able to describe and apply basic ML model building and validation procedures.
- 50%-59%:Be able to discuss and apply more advanced ML model building, validation
  and interpretation procedures.
- 60%-69%:Be able to solve problems using ML techniques in a professional manner,
  including discovering and integrating related knowledge across domains.
- 70%-100%:All the above to an excellent level. Be able to analyse and design solutions
  to a high standard for a range of both complex and unforeseen problems through the
  use and modification of appropriate skills and tools.
