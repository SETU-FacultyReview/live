indicative_content:
- Review of model building, with increased focus on optimisation and validation.
- Advanced techniques for data preprocessing and feature engineering.
- Newer types of ML models, including deep learning and large language models.
- Machine Learning for decision support - assessing the limits of what the models
  can provide, as well as strategies to interpret ML models.
- Machine Learning as enabler of smart ICT solutions.
learning_outcomes:
- Summarise how ML pipelines are built and display a clear understanding of the steps
  involved.
- Critically evaluate the fundamental concepts behind each stage of a Machine Learning
  pipeline, challenging any assumptions, ensuring sound choices are made.
- Justify the use of appropriate tools and techniques for each stage of the ML pipeline.
- Evaluate, interpret and utilize results obtained at each step of a Machine Learning
  pipeline.
- Create a working prototype for a set of problems that employ Machine Learning to
  provide the analytical component of the solution.
learning_and_teaching_methods:
- The lectures will introduce the theory content to the student. The student will
  be encouraged to participate in class discussions and ask questions to support their
  learning process.
- The practical classes facilitate the student in implementing the theory learned
  in the lectures, generally using software tools and packages drawn from the python
  machine learning ecosystem.
- Students will apply appropriate tools and methods to Machine Learning exercises
  provided in the practical classes and the continuous assessments.
- Students will implement appropriate tools and methods to ML-based continuous assessment
  projects.
- Students will interpret and present the findings produced in the practical classes
  and continuous assessment.
