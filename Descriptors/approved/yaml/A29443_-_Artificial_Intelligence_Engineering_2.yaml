aim: 'It is assumed the student is familiar with the fundamental concepts and techniques
  of data investigations using machine learning procedures. Students build upon the
  knowledge of modelling and prediction techniques gained in Artificial Intelligence
  Engineering 1, learning how to apply these procedures in more realistic contexts.
  Students will also learn about how machine learning results can be presented in
  ways that support decision making that is objective, methodologically sound and
  explainable. Compared to its Artificial Intelligence Engineering 1 companion module,
  the data will require more preparation before analysis, and there is also more emphasis
  on generative techniques for AI, and on application domains, especially language
  and text processing.

  '
