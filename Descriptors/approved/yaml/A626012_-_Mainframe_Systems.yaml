full_title: Mainframe Systems
short_title: Mainframe Systems
credits: 5
level: Advanced
author: PWINDLE
history_comment: New Level 8 module incorporating mainframe systems.
faculty: Science and Computing
department: Computing and Mathematics
cluster: Networks and Cloud
aim: 'This module provides an introduction to mainframe systems and their role  in
  modern enterprise computing environments. Students develop foundational  knowledge
  of mainframe architecture, operating systems, job control, security,  and programming.
  Emphasis is placed on practical skills in accessing and working  within a live mainframe
  environment using TSO/ISPF, JCL, COBOL, and basic RACF  concepts. Students will
  also examine how mainframe systems differ from conventional  PC and Linux server
  environments and how they integrate with contemporary  hybrid cloud infrastructures.

  '
