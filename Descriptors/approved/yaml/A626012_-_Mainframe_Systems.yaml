indicative_content:
- '*Enterprise Computing and Mainframes:* role of mainframes in banking, government,
  healthcare, retail; high-volume transaction processing; reliability and availability
  concepts.'
- '*Architecture:* overview of systems; centralised architecture; logical partitions
  (LPARs); comparison with other server environments.'
- '*Operating Systems:* overview of OS; introduction to VM (conceptual); batch and
  interactive processing.'
- '*Accessing the Mainframe:* TSO/ISPF environment; dataset navigation; job submission;
  interpreting job output.'
- '*Introduction to JCL:* job structure; EXEC and DD statements; return codes; batch
  processing fundamentals.'
- '*Introduction to COBOL:* program structure; data division; simple file handling;
  compile, link and run cycle.'
- '*Introduction to RACF:* users, groups and permissions; access control concepts;
  security in regulated industries.'
- '*Mainframe and Cloud Integration:* hybrid cloud concepts; APIs and service exposure;
  role of mainframes in modern enterprise architectures.'
learning_outcomes:
- Explain the architecture and enterprise role of mainframe systems.
- Compare mainframe systems with other server environments.
- Use TSO/ISPF and JCL to submit, monitor, and interpret batch jobs.
- Develop and execute simple COBOL programs within a mainframe environment.
- Describe fundamental mainframe security concepts using RACF.
- Discuss how mainframe systems integrate with modern cloud and enterprise architectures.
learning_and_teaching_methods:
- Lectures introducing core architectural, operational and enterprise concepts.
- Supervised practical laboratory sessions using a live environment.
- Guided hands-on exercises in TSO/ISPF, JCL and COBOL.
- Applied mini-project integrating job control and program development.
- Independent study supported by structured lab tasks.
