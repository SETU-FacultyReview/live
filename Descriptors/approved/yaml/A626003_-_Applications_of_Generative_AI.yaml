  status: E
prerequisites: []
corequisites: []
indicative_content:
- '*Introduction to generative AI:* LLMs, multimodal models, diffusion models (conceptual
  overview)'
- '*Prompt engineering:* zero-shot, few-shot, instruction prompts, structured/system
  prompts'
- '*Text generation applications:* summarisation, rewriting, ideation, drafting'
- '*Code generation:* assisted programming, debugging, test creation, documentation
  workflows'
- '*Image and multimodal generation:* text-to-image, editing, prompt refinement, creative
  applications'
- '*Audio and speech generation:* voice synthesis, music generation (practical usage)'
- '*Generative AI for data work:* data cleaning, documentation, synthetic data creation'
- '*Model reliability:* hallucinations, verification, bias, prompt failure cases'
- '*Responsible AI:* academic integrity, safety, fairness, content filtering, copyright
  awareness'
- '*Applications of generative AI:* troubleshooting, configuration, installation and
  maintenance of systems and software'
learning_outcomes:
- Use a range of generative AI tools to complete text, code, image, and audio generation
  tasks.
- Design effective prompts and refine them iteratively to improve the quality of generated
  output.
- Evaluate generated content for accuracy, coherence, safety, and ethical implications.
- Create small applications or workflows integrating generative AI APIs.
- Explain at a high level how LLMs, multimodal models, and diffusion models operate.
- Apply responsible AI principles when using generative systems, including fairness,
  safety, and academic integrity.
learning_and_teaching_methods:
- Lectures introducing conceptual foundations, responsible AI, and applied workflows.
- Hands-on practical labs using real generative AI tools and APIs.
- Scenario-based tasks and problem-solving activities.
- Mini-project focusing on applied generative AI use cases.
- Critical discussions and reflection on ethical and societal impacts.
