reference: A626003
full_title: Applications of Generative AI
short_title: Applications of Generative AI
credits: 5
level: Intermediate
author: KMURPHY
history_comment: New module on the Data Science and AI stream.
faculty: Science and Computing
department: Computing and Mathematics
cluster: Data Science and AI
aim: 'This module introduces students to the practical use of modern generative AI
  systems across text, code, images, audio, and multimodal content. Students learn
  effective prompting techniques, workflow integration, evaluation of generated content,
  and responsible AI practices. The focus is on applied usage and critical engagement
  rather than mathematical or algorithmic theory, which will be addressed in later
  modules such as Natural Language Processing. Students gain early hands-on experience
  in designing AI-assisted solutions while understanding safety, limitations, and
  ethical considerations.

  '
