assessment_criteria:
- '<40%: Limited understanding; incomplete or incorrect model implementations; little
  or no evaluation.'
- '40%-49%: Basic understanding with significant gaps; partially functioning pipelines
  with limited analysis.'
- '50%-59%: Adequate implementations with generally correct evaluation; some issues
  in reasoning or interpretation.'
- '60%-69%: Good model design, sound evaluation, and clear analysis; mostly correct
  and coherent submissions.'
- '70%-100%: Excellent technical execution with strong justification; comprehensive
