indicative_content:
- '*Foundations of NLP:* tokenisation, normalisation, subword algorithms (BPE, WordPiece)'
- '*Linguistic concepts:* morphology, syntax, semantics (practical overview)'
- '*Classical text representations:* Bag-of-Words, n-grams, TF-IDF'
- '*Distributed semantic representations:* Word2Vec, GloVe; sentence/document embeddings'
- '*Classical statistical NLP:* n-gram language models, smoothing, sequence labelling'
- '*Neural sequence models:* RNNs, LSTMs, GRUs; encoder-decoder architectures'
- '*Attention mechanism and Transformer architecture:* (encoder, decoder, multi-head
  attention)'
- '*Pretrained models:* BERT, GPT-type models, fine-tuning, adapter methods'
- '*Prompting and in-context learning:* building on Generative AI module'
- '*NLP task families:* text classification, NER, sequence labelling, summarisation,
  QA, translation'
- '*Evaluation:* accuracy, F1, perplexity, ROUGE, BLEU; error analysis and model diagnostics'
- '*Ethical considerations:* bias, fairness, misuse, hallucinations, copyright, privacy'
learning_outcomes:
- Explain core NLP concepts including tokenisation, embeddings, attention, and language
  modelling.
- Process and prepare text datasets using standard NLP preprocessing and representation
  techniques.
- Implement classical and neural sequence models for common NLP tasks.
- Apply modern pretrained language models to real-world NLP problems.
- Evaluate and analyse NLP system performance using appropriate metrics and error-analysis
  techniques.
- Discuss ethical, fairness, and responsible AI considerations in designing NLP systems.
learning_and_teaching_methods:
- Lectures presenting theory, algorithms, and model architectures.
- Hands-on practical labs using modren frameworks.
- Model-building exercises using classical and deep-learning approaches.
- Critical evaluation and interpretation of modern NLP model outputs.
- Use Python ecosystem (spaCy, NLTK, scikit-learn, PyTorch/TensorFlow, Hugging Face
  Transformers) or equivalent for practical work.
