aim: 'This module provides students with a solid theoretical and practical foundation  in
  Natural Language Processing (NLP). It introduces classical and modern methods  for
  processing, understanding, and generating natural language with a particular  focus
  on deep-learning-based approaches such as Transformers. Students learn to  build
  end-to-end NLP pipelines, apply pretrained language models, evaluate  performance,
  and analyse model behaviour. Ethical and responsible AI considerations  are integrated
  throughout.

  '
