indicative_content:
- Vector Spaces, Norms, and Geometry of Data, including inner products, distances
  and similarity, orthogonality, subspaces and feature representations of states in
  Reinforcement Learning (RL)
- Matrix Decompositions and Spectral Methods, including eigensystems, SVD, low-rank
  approximations, conditioning, Markov processes and successor representations in
  RL.
- Multivariate Calculus for Optimization, with Automatic Differentiation, including
  gradients and Jacobians, local approximations, policy gradient methods in RL.
- Numerical Optimization Algorithms and Learning Dynamics, including (stochastic)
  gradient descent, choice of hyperparameters (momentum, learning rate, etc.), role
  of convexity, constraints and regularisation, and actor-critic models in RL
- Numerical Linear Algebra and Computational Considerations, including computational
  complexity, algorithm choice and configuration, stability and conditioning, under-
  and overdetermined systems and the effects of scale
learning_outcomes:
- Represent datasets and models using vectors and matrices, choose and interpret norms,
  distances, and angles, explain linear regression as a projection onto a subspace
  and reason geometrically about similarity and feature scaling.
- Compute and interpret eigensystems and SVD, explain and employ dimensionality techniques
  such as PCA and techniques such as UMAP for visualising high dimensional data, use
  low-rank approximations to compress data, analyse system conditioning, and relate
  eigenvalues to long-term behaviour in RL.
- 'Compute gradients and higher order derivatives of multivariate functions by numerical
  and analytical means, apply the chain rule in vector/matrix form, derive gradient
  updates for common ML loss functions that include MSE and cross entropy, understand
  gradients of expected return in RL, and interpret learning curves '
- Formulate ML training as an optimization problem, analyze gradient-based optimization
  algorithms, explain convexity and its implications for learning, and understand
  the role of regularization and early stopping in response to optimization failure
  modes.
- Make informed choices and use computational linear algebra libraries successfully
  from python, reason about the metrics provided, adjust the settings and diagnose
  the problems in terms of the characteristics of the data and the problem being solved.
learning_and_teaching_methods:
- Lectures introducing theory, e.g., of machine learning as an optimisation problem
  and how to make the problem more tractable.
- Hands-on practical labs using Python (or equivalent) and industry-standard frameworks
  and libraries.
- Case studies modelling dimensionality reduction, regression, classification and
  clustering as optimisation problems, to be solved using gradient-based and RL techniques,
  and making suitable implementation choices.
- Selected projects where students apply mathematical and numerical methods to derive
  knowledge from data. Note that building ML applications for deployment is covered
  elsewhere in this stream..
- Use well-established libraries and frameworks from the  Python ecosystem (numpy,
  scipy, pandas, scikit-learn, matplotlib, PyTorch and supporting libraries) or equivalent
  for practical work.
