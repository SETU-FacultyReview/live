reference: A626004
full_title: Optimisation and Reinforcement Learning
short_title: Optimisation and RL
credits: 5
level: Intermediate
author: BBUTLER
history_comment: New module on the Data Science and AI stream.
faculty: Science and Computing
department: Computing and Mathematics
cluster: Data Science and AI
aim: 'This module introduces students to the mathematical foundations of machine learning,
  notably computational linear algebra, numerical optimisation and vector calculus.  Nearly
  all machine learning procedures work by minimising a loss function, often using
  variations of gradient descent. As such, they iterate towards their solution, so
  understanding of convergence and the effect of starting values and parameter choices
  are critical. At each step, it is common to linearise the system, and this is where
  computational linear algebra becomes essential. In addition to gradient-based optimisation,
  there are other ways to search the space for the optimum settings. One such technique
  is reinforcement learning, and this formulation will be introduced and its use in
  applications (like controlling robots and aligning LLMs) will be emphasised.

  '
