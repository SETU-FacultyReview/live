- '40%-49%: Basic comprehension is demonstrated but the use of these techniques is
  lacking. Application to problems may be partially correct and/or evaluation is limited.'
- '50%-59%: Competent understanding with generally effective usage. However, techniques
  could be used more effectively.'
- '60%-69%: Good application of concepts interpretation of metrics with appropriate
