indicative_content:
- Electronic componnents and prototyping
- PCB design, build and validation
- PCB testing tools and techniques
- Team-based/collaborative learning and communication
learning_outcomes:
- Create an electronic schematic and associated netlist validation.
- Select and assign appropriate component footprints, then produce a PCB layout using
  auto-route techniques.
- Generate manufacture files.
- Assemble and populate a PCB using appropriate hand tools and soldering techniques.
- Test and debug the assembled hardware using appropriate instruments and capture
  test records.
- Produce a structured project report and present the design, build, and test outcomes
  to the project team.
learning_and_teaching_methods:
- Combination of lectures and practical labs.
- Cooperative learning/peer tutoring in labs and workshops.
- Self-directed learning.
