assessment_criteria:
- <40%:Inability to produce and present a working artifact. Little evidence of schematic
  design or report project.
- 40%-49%:Ability to develop a model and present a basic working artifact. Reasonable
  evidence of communication and report production through schematic design and a structured
  report.
- 50%-59%:All the above and in addition has produced a good working artifact showing
  evidence of the different phases through the PCB production lifecycle.
- 60%-69%:All the above and in addition, be able to integrate and analyse concepts
  from more than two and at least one past module, showing an ability to transfer
  skills and knowledge across modules/strands. Shows evidence of strong communication
  and documentaion and of how the process has benefitted from both.
- 70%-100%:All previous to an excellent level. Shows the ability to evaluate different
  models and combine self-acquired knowledge. Shows synthesis through the implementation
  of cross-strand innovative artifacts through excellent communication and documentation.
