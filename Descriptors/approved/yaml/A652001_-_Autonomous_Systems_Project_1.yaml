reference: A652001
full_title: Autonomous Systems Project 1
short_title: Autonomous Systems Project 1
credits: 5
level: Introductory
author: FWWALSH
history_comment: New module on the Automotive Software Engineering stream.
faculty: Science and Computing
department: Computing and Mathematics
cluster: Automotive, Automation and IoT
aim: This module guides students through a full design-and-build cycle for an embedded
  system, using industry-standard tools and workflows. Students will complete schematic
  capture, PCB layout, and generation of manufacturing files, followed by hardware
  assembly and structured testing. Testing will include remote serial diagnostics
  as well as local measurements using an oscilloscope and multimeter. The embedded
  design will incorporate a typical microcontroller-based platform, a range of local
  and remote inputs and outputs, and both wired and wireless communication interfaces.
