indicative_content:
- Vehicle network architectures
- Event-triggered network protocols - CAN, CAN-FD, CAN-XL.
- Time-triggered network protocols - LIN, FlexRay.
- Service-Oriented Architectures - Automotive Ethenet.
- Network simulation and testing.
learning_outcomes:
- Understand the characteristics of the different network protocols.
- Simulate signal-oriented vehicle network communication networks.
- Simulate service-oriented vehicle network communication networks.
- Use industry standard network development and testing tools to troubleshoot network
  problems.
