indicative_content:
- Core C++ Foundations
- Object-Oriented Programming for Games
- Game Engine-Oriented C++
- Gameplay Systems
- C++ and Visual Scripting Integration
learning_outcomes:
- Implement interactive gameplay systems using C++ within a game engine environment
- Apply object-oriented programming principles to design modular and reusable game
  code.
- Use engine-provided container types and memory management systems appropriately
  in gameplay programming.
- Develop game objects using component-based architectures common to modern game engines.
- Integrate C++ code with visual scripting tools to support flexible and iterative
  game development.
learning_and_teaching_methods:
- Lectures and practical classes are used to deconstruct and analyse existing C++
  games programmes and to plan, code and test solutions using a contemporary development
  environment.
- Self-directed learning activities will require students to will reflect upon the
  module materials, diagnose their learning needs and conduct research to satisfy
  these needs.
