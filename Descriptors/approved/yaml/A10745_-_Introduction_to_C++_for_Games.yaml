reference: A10745
full_title: Introduction to C++ for Games
short_title: Introduction to C++ for Games
credits: 5
level: Intermediate
author: BLYNG
history_comment: Revised module descriptor to better align C++ teaching with modern
  game engine workflows. Reduced emphasis on STL-centric programming and updated indicative
  content and learning outcomes to reflect Unreal Engine-based gameplay development
  and component-driven design.
faculty: Science and Computing
department: Computing and Mathematics
cluster: Game Development
aim: This module introduces students to the fundamentals of C++ programming for games,
  with a focus on modern game engine workflows. Students will develop interactive
  gameplay systems using C++ within a game engine context, gaining experience with
  object-oriented design, memory management concepts, and component-based architectures.
