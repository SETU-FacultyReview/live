faculty: Science and Computing
department: Computing and Mathematics
cluster: Data Science and AI
aim: As artificial intelligence (AI) technologies become increasingly integrated into
  society, understanding their ethical and regulatory implications is critical. This
  module explores the ethical challenges posed by AI systems, including issues of
  bias, accountability, transparency, and impact. Students will examine and assess
  the impact of current and emerging regulatory frameworks such as the EU AI Act and
  GDPR on the design and deployment of AI. Students will learn to assess ethical risks,
  suggest responsible solutions, and discuss how AI should be governed in society.
