assessment_criteria:
- '<40%: Unable to express knowledge/concepts of Artificial Intelligence ethics and
  regulations. Inability to participate in class discussion. Inability to produce
  case study report.'
- '40%-49%: Able to describe basic concepts of ethical and regulatory implications
  of AI. Explain in own words the impacts and risks of an AI case study in relation
  to bias, discrimination, labour displacement, surveillance and environmental.'
- '50%-59%: Ability to understand key concepts of the AI ethics and regulatory domain
  and ability to discover and integrate related knowledge from other knowledge domains.'
- '60%-69%: All of the above and in addition, can present on the issues from multiple
  stakeholder perspectives.'
- '70%-100%: All the above to an excellent level.'
essential_material:
- 'Coeckelbergh, M. (2020) _AI ethics_. Cambridge, MA: MIT Press. (MIT Press Essential
