indicative_content:
- Introduction to Ethics
- Foundations of AI Ethics
- Data Acquisition, Ownership, Rights and Provenance
- Societal and Global impacts (Algorithmic Bias, discrimination, environmental)
- AI Governance (Explainable AI) and Regulation (EU, GDPR, US, UK, UNESCO, OECD)
- AI Ethics (society, sustainability, innovation, security, safety, etc.)
- Case Studies in Ethical and Regulatory Challenges (facial recognition, recommender
  systems, GenAI)
learning_outcomes:
- Critically evaluate key ethical principles relevant to the development and deployment
  of AI systems, including fairness, accountability, transparency, and privacy.
- Analyse the societal and global impacts of AI technologies, including bias, discrimination,
  labour displacement, surveillance and environmental.
- Understand and assess national and international regulatory frameworks and policy
  initiatives governing AI, such as the EU AI Act, GDPR, and emerging standards.
- Apply ethical reasoning and regulatory considerations to real-world AI case studies,
  identifying potential impacts and risks and proposing responsible mitigation strategies.
- Communicate clearly about ethical and regulatory issues in AI, showing awareness
  of different stakeholder perspectives.
learning_and_teaching_methods:
- This module will be taught through a variety of ways, including direct instructions,
  discussions, and case-based practical studies.
- Self-directed learning will also be encouraged throughout the duration of the module.
- Students in this module are required to engage in discussions and class exercises,
  enhancing their participation.
- The topics of Artificial Intelligence ethics and regulations will be introduced
  and explained by instructors in lectures.
- The case-based practical studies implemented in this module will assist students
  in gaining problem-based skills that result in significant improvement in their
  critical thinking and active participation in the learning process.
