  thinking_. New York: OUP USA.'
- 'Santos, O. (2024) _Beyond the algorithm: AI, security, privacy, and ethics_. Boston:
  Addison-Wesley Professional.'
- 'Boddington, P. (2023) _AI ethics: a textbook_. Singapore: Springer. (Artificial
  Intelligence: Foundations, Theory, and Algorithms).'
