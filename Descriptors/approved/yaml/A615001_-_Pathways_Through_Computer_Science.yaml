reference: A615001
full_title: Pathways Through Computer Science
short_title: Pathways Through CS
credits: 5
level: Introductory
author: ROCONNOR
history_comment: New module introducing specialist streams to all Computer Science
  students in a structured fashion.
faculty: Science and Computing
department: Computing and Mathematics
cluster: Computer Science
aim: This module introduces first-year students to the full range of Computer Science
  streams through structured taster units. Students gain hands-on exposure to core
  concepts, tools, and practices in each pathway, enabling informed selection of their
  Year 2 stream (e.g., Cloud & Networks, Security/Forensics, Automotive Software Engineering,
  Data Science & AI, Games Development). Emphasis is on reflection, peer interaction,
  and career alignment.
programmes:
- timetable: null
