  stage: 1
  semester: 2
  status: M
prerequisites: []
corequisites: []
indicative_content:
- The student is required to actively engage in multiple taster sessions for the streams
  available for elective study on Computer Science. Each taster activity includes
  labs, workshops and a short reflective task.
learning_outcomes:
- Describe the aims, content, tools, and career contexts of the major Computer Science
  streams through practical taster activities.
- Perform guided introductory tasks in each stream (e.g., basic scripting, data handling,
  hardware setup) and reflect on associated professional skills and environments.
- Analyse their own aptitudes, interests, and strengths relative to each stream using
  self-assessment tools and tutor feedback.
- Justify their Year 2 stream choice in a reflective portfolio, linking module experiences
  to personal goals and computing career pathways.
learning_and_teaching_methods:
- This is a skills-based module, but the emphasis is on student reflection.
- The lab hours will be timetabled together.
