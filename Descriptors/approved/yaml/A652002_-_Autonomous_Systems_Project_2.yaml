indicative_content:
- Autonamous system design
- Hardware Interfacing
- Embedded programming
- Scrum-based Project Manangement
- Team-based/collaborative learning and communication
learning_outcomes:
- Contribute to the specification and design of an autonomous, themed embedded system
  solution.
- Design and implement the required hardware interfaces to support the system.
- Develop the embedded software needed to deliver the required autonomous behaviours
  and system functionality.
- Collaborate effectively as part of a team to deliver a single, integrated class
  solution.
- Apply Scrum-based project management practices to plan and monitor progress.
- Integrate, test, and document individual subsystems within the overall system design.
- Demonstrate and validate individual subsystem functionality within the integrated
  system.
learning_and_teaching_methods:
- Combination of lectures and practical labs.
- Cooperative learning/peer tutoring in labs and workshops.
- Self-directed learning.
