assessment_criteria:
- <40%:Inability to produce and present a working artifact. Little evidence of specification
  and design of embedded and integrated subsystem solution
- 40%-49%:Ability to develop a model and present a basic working sunsystem artifact
  with relecent interfaces. Reasonable evidence of communication and collaboaration
  through sprint planning, task tracjing and reviews. Adequate subsystem documentaion
  and report.
- 50%-59%:All the above and in addition has produced a good working subsystem.Evidence
  of good collaborative participation through the project lifecycle and clear integration
  into overall system.
- 60%-69%:All the above and in addition, be able to integrate and analyse more advanced
  concepts from more than two and at least one past module, showing an ability to
  transfer skills and knowledge across modules/strands. Strong collaboration and involvement
  in all scrum-based activities. Strong subsystem report.
- 70%-100%:All previous to an excellent level. Shows the ability to evaluate different
  models and combine self-acquired knowledge. The student will also show consistent,
  proactive participation in Scrum activities (planning, stand-ups, reviews, retrospectives,
  and task tracking) and produce a high-quality subsystem report that clearly justifies
  design decisions and provides robust integration and test evidence within the overall
  class solution.
