reference: A652002
full_title: Autonomous Systems Project 2
short_title: Autonomous Systems Project 2
credits: 5
level: Introductory
author: FWWALSH
history_comment: New module on the Automotive Software Engineering stream
faculty: Science and Computing
department: Computing and Mathematics
cluster: Automotive, Automation and IoT
aim: This modules will utilise the students embedded board from the provious semester
  to design and a build an automous based system. The desing will be team based, which
  each individual student been assigned a personal scope with the overall project.
  The project wil include hardware interfacing, software development and system integration
  and testing. The student will use scrum based management techniques for the project.
