reference: A626013
full_title: Artificial Intelligence for Natural Language Processing
short_title: AI for NLP
credits: 5
level: Advanced
author: KMURPHY
history_comment: New module currently under review in CE3, SSD and AI (now approved).
faculty: Science and Computing
department: Computing and Mathematics
cluster: Data Science and AI
aim: This module provides students with an advanced understanding of large language
  models (LLMs) and their role in the development of intelligent applications. Students
  will explore the theoretical underpinnings of transformer architectures, preparing
  text for model training, use of pre-trained models, and fine-tuning techniques,
  alongside current industry practices for deploying models through APIs. The module
  emphasises practical development using prompt engineering and evaluation techniques,
  while also encouraging critical reflection on ethical, legal, and societal challenges
  such as bias, misinformation, and data privacy. Through hands-on project work and
  critical analysis, students will gain the skills to responsibly develop and integrate
  LLM capabilities into real-world software systems.
