assessment_criteria:
- '<40%: Unable to demonstrate understanding of the theoretical foundations and architectural
  principles of large language models, including transformer-based architectures.
  Inability to develop an LLM powered application and a technical report. Inability
  to attend presentation.'
- '40%-49%: Able to describe the theoretical foundations and architectural principles
  of large language models, including transformer-based architectures. Developed an
  LLM powered application with limited functionality, along with a technical report
  and presentation, demonstrating understanding of the technical design.'
- '50%-59%: Able to understand the theoretical foundations and architectural principles
  of large language models, including transformer-based architectures. Ability to
  develop LLM powered application using public API and to evaluate the performance
  and critically analyse the work in a technical report.'
- '60%-69%: All of the above and in addition, can present the evaluation of performance
  and the responsible use of LLMs in real-world settings.'
- '70%-100%: All the above to an excellent level.'
