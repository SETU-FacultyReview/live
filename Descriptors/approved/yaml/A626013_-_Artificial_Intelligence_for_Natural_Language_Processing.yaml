indicative_content:
- Overview of NLP and the evolution of LLMs
- Transformer architecture and training base models
- Fine-tuning pre-trained base models
- Tokenization, embeddings, attention mechanisms
- Prompt engineering and zero/few-shot learning
- Accessing and using LLM APIs (OpenAI, Hugging Face)
- '*Building applications:* chatbots, summarisation, Q&A systems, text classification'
- Performance evaluation metrics
- '*Ethical risks:* hallucination, bias, misuse, traceability, data exposure, copyright'
- Guardrails and responsible deployment
learning_outcomes:
- Demonstrate an understanding of the theoretical foundations and architectural principles
  of large language models, including transformer-based architectures.
- Explain and evaluate the processes of pretraining, fine-tuning, and transfer learning
  in the development of LLMs.
- Design and develop functional LLM-powered applications using techniques such as
  prompt engineering and integration with public APIs.
- Analyse and assess the performance of LLMs using appropriate evaluation methods,
  including both quantitative metrics and qualitative techniques.
- Critically evaluate ethical, legal, and societal issues surrounding the deployment
  and use of LLMs, including bias, misinformation, and data privacy
learning_and_teaching_methods:
- This module will be taught through a variety of ways, including lectures, discussions,
  and case-based practical studies.
- Self-directed learning will also be encouraged throughout the duration of the module.
- Students in this module are required to engage in discussions and labs, enhancing
  their participation.
- The topic of Large Language Models and its related concepts will be introduced and
  explained by instructors in the lectures.
- The case-based practical studies implemented in this module through labs will assist
  students in gaining problem-based skills that result in significant improvement
  in their critical thinking and active participation in the learning process.
