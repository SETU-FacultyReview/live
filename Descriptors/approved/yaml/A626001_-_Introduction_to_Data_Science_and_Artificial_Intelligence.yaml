reference: A626001
full_title: Introduction to Data Science and Artificial Intelligence
short_title: Introduction to DS and AI
credits: 5
level: Intermediate
author: BBUTLER
history_comment: New module on the Data Science and AI stream.
faculty: Science and Computing
department: Computing and Mathematics
cluster: Data Science and AI
aim: 'This module introduces students to data, its management and usage, in all its
  forms. It considers the characteristics of varied data sources (enterprise databases,
  internet and intranet endpoints accessible by APIs, cyberphysical systems at the
  network edge, etc.). Push and pull strategies for obtaining data are presented and
  compared e.g., in terms of timeliness and completeness, especially from streaming
  data sources. Data context (its structure, metadata, inbuilt relationships and quality)
  is considered and students shown how to incorporate this into model building pipelines.
  Having obtained the data, a suite of data wrangling procedures are considered, including
  filtering, merging and reshaping, with the goal being to prepare a data set suitable
  for Exploratory Data Analysis and model building. Students will be able to develop
  familiarity with frameworks supporting these operations during practicals.

  '
