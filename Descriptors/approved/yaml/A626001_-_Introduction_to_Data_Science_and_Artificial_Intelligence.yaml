assessment_criteria:
- '<40%: Unable to obtain data programmatically in a repeatable fashion from even
  structured data sources'
- '40%-49%: Able to obtain data from highly structured, largely static data sources,
  but unable to assess and manage its quality and suitability for further analysis'
- '50%-59%: Able to obtain data from varied sources, but with limited synergy, and
  some deficiencies in how the data is assessed and prepared for use later in the
  data pipelines'
- '60%-69%: Able to obtain data from varied sources in a way that maximises its utility
  for machine learning, but with limited focus on reliability, scalability and observability'
- '70%-100%: Able to build a scalable, performant and observable data application,
  that provides a sound foundation for machine learning operations'
