indicative_content:
- Push vs pull data architectures in data-first distributed computing
- Programmed data extraction from relational and document databases
- Event-based and streaming data - APIs, queuing and state management
- Functional programming for building robust and scalable data pipelines
- Design patterns for filtering, merging, aggregating, projecting, reshaping and mapping
  data between different representations
learning_outcomes:
- Devise a strategy to understand the data that is available for analysis
- Design a suitable data architecture, incorporating data pipelines with robust validation
  and state management (start, stop, restart, report, ...)
- Develop code to implement those data pipelines in a robust and scalable manner,
  with built-in validation, visualisation and observability
- Build distributed applications that extract source data and transform it so that
  it is suitable for machine learning
- Use informed choices of software frameworks and specify hardware requirements to
  ensure such applications meet both functional and nonfunctional requirements
learning_and_teaching_methods:
- Lectures introducing theory, e.g., of data structure models, queues, reliability,
  automation....
- Hands-on practical labs using Python (or equivalent) and industry-standard frameworks
  and libraries.
- Case studies designing data architectures and making implementation choices.
- Selected projects where students apply data engineering principles by building deployable
  data ingestion and transformation applications.
- Use Apache-based big data platforms and the Python ecosystem (pandas, DuckDB, polars,
  matplotlib, ...) or equivalent for practical work.
