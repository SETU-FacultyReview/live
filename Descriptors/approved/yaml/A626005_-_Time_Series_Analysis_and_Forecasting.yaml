assessment_criteria:
- '<40%: Limited understanding of time series concepts. Work lacks structure, contains
  significant errors, and demonstrates minimal ability to apply or evaluate forecasting
  methods.'
- '40%-49%: Basic comprehension demonstrated but with gaps in analysis or implementation.
  Solutions show partial correctness and limited evaluation.'
- '50%-59%: Competent understanding with generally correct modelling and evaluation.
  Has limitations in feature engineering, model selection, or interpretation.'
- '60%-69%: Good application of concepts with appropriate model selection, sound evaluation,
  and clear communication. Minor issues only.'
- '70%-100%: Excellent technical execution with strong justification of modelling
  choices, comprehensive evaluation and backtesting, and clear, insightful interpretation
  of forecasting results.'
