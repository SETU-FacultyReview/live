indicative_content:
- '*Introduction to time series concepts:* trend, seasonality, cycles, noise'
- Stationarity, autocorrelation (ACF), partial autocorrelation (PACF)
- '*Data preparation:* resampling, missing data handling, normalisation, differencing,
  feature engineering'
- '*Classical models:* AR, MA, ARMA, ARIMA, SARIMA'
- Exponential smoothing and ETS models
- State-space models and the Kalman filter
- '*Machine-learning forecasting approaches:* tree-based models, feature-based ML'
- '*Deep learning models:* RNNs, LSTMs/GRUs, and Transformers for sequences'
- '*Forecast evaluation:* MAE, RMSE, MAPE/SMAPE, cross-validation and backtesting,
  prediction intervals, residual diagnostics'
- '*Applications:* demand forecasting, anomaly detection, IoT/sensor analysis, finance,
  energy forecasting, risk and scenario modelling'
learning_outcomes:
- Explain key concepts in time series analysis, including trend, seasonality, stationarity,
  and autocorrelation.
- Prepare and transform temporal datasets, including feature engineering and resampling
  suitable for forecasting tasks.
- Build, fit, and evaluate classical statistical forecasting models such as ARIMA,
  SARIMA, and ETS.
- Implement machine-learning and deep-learning forecasting models, including RNN/LSTM
  and Transformer-based approaches.
- Evaluate forecast accuracy using appropriate metrics and backtesting techniques,
  and interpret uncertainty in forecasts.
learning_and_teaching_methods:
- Lectures introducing theoretical foundations and modelling approaches.
- Hands-on practical labs using Python (or equivalent) and industry-standard libraries.
- Case studies applying forecasting to multiple domains.
- Guided project work with feedback and iterative model development.
- Use Python ecosystem (pandas, statsmodels, scikit-learn, Prophet, PyTorch/TensorFlow,
  Darts) or equivalent for practical work.
