reference: A626005
full_title: Time Series Analysis and Forecasting
short_title: TS Analysis & Forecasting
credits: 5
level: Intermediate
author: KMURPHY
history_comment: New module on the Data Science and AI stream.
faculty: Science and Computing
department: Computing and Mathematics
cluster: Data Science and AI
aim: 'This module provides students with a comprehensive introduction to analysing
  and forecasting temporal data. Students learn to identify time series  components,
  apply classical statistical forecasting models, and implement modern machine-learning
  and deep-learning approaches for sequence prediction. Emphasis is placed on practical
  forecasting skills, evaluation and  backtesting, uncertainty quantification, and
  the ability to apply models  to real-world domains such as demand forecasting, IoT/sensor
  analysis, finance, anomaly detection, and risk assessment.

  '
